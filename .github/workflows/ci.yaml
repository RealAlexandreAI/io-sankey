name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Wake Instabox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: chmod +x scripts/instabox-wake.sh && ./scripts/instabox-wake.sh
  build:
    name: Build and test
    needs: wake
    runs-on: [self-hosted, instabox, instabox-usa]
    timeout-minutes: 15
    env:
      VERBOSE: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: |-
          go test -count=1 -race ./...
